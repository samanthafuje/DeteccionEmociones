{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Sistema de Evaluación</title>

    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">

</head>

<body>


    <!-- BARRA SUPERIOR -->

    <header class="navbar">

        <div class="logo">
            🧠 Sistema de Evaluación
        </div>

    </header>


    <!-- CONTENIDO -->

    <main class="container login-container">

        <div class="card login-card">


            <!-- ICONO -->

            <div class="icon-container">
                🔐
            </div>


            <!-- TITULO -->

            <h1>
                Iniciar sesión
            </h1>


            <p class="descripcion">
                Ingresa tus datos para acceder al sistema
                de evaluación.
            </p>


            <!-- ERROR -->

            {% if error %}

                <div class="login-error">
                    {{ error }}
                </div>

            {% endif %}


            <!-- FORMULARIO -->

            <form method="POST">

                {% csrf_token %}


                <!-- CORREO -->

                <div class="form-group">

                    <label for="username">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Correo electrónico"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- BOTÓN -->

                <button type="submit" class="btn">
                    Iniciar sesión
                </button>


            </form>


            <!-- REGISTRO -->

            <div class="enlace">

                ¿No tienes una cuenta?

                <a href="{% url 'registro' %}">
                    Registrarse
                </a>

            </div>


        </div>

    </main>

</body>

</html>
