
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Test de estilos de aprendizaje
        {% endblock %}
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6fa;
            color: #333;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        button {
            cursor: pointer;
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <header>

        <h1>
            Test de estilos de aprendizaje
        </h1>

    </header>

    <main>

        {% block content %}
        {% endblock %}

    </main>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
